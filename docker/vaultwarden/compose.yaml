services:
  vaultwarden:
    image: vaultwarden/server@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    container_name: vaultwarden
    restart: unless-stopped

    expose:
      - "80"

    environment:
      DOMAIN: "https://vaultwarden.${JARVIS_SERVICE_DOMAIN:?Set the service DNS suffix}"
      SIGNUPS_ALLOWED: "false"
      TZ: "${JARVIS_TZ:-UTC}"
    volumes:
      - vaultwarden_data:/data

    networks:
      - service_net

volumes:
  vaultwarden_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${JARVIS_APPDATA_ROOT:?Set an absolute data directory}/vaultwarden/data

networks:
  service_net:
    external: true
    name: ${JARVIS_DOCKER_NETWORK:?Set the shared network name}
